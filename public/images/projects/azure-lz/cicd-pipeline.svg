<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-label="CI/CD pipeline for Terraform Landing Zone with OIDC, plan and apply stages">
  <defs>
    <linearGradient id="bgCi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#050914"/>
    </linearGradient>
    <linearGradient id="stageGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="approveGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(245,158,11,0.18)"/>
      <stop offset="100%" stop-color="rgba(120,53,15,0.18)"/>
    </linearGradient>
    <linearGradient id="okGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(16,185,129,0.22)"/>
      <stop offset="100%" stop-color="rgba(6,78,59,0.22)"/>
    </linearGradient>
    <pattern id="gridCi" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="rgba(96,165,250,0.08)" stroke-width="0.5"/>
    </pattern>
    <filter id="dropS" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="off"/>
      <feFlood flood-color="#000" flood-opacity="0.45"/>
      <feComposite in2="off" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="rgba(96,165,250,0.65)"/>
    </marker>
    <style>
      .lbl   { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; fill: #f1f5f9; }
      .sub   { font-family: 'Inter', system-ui, sans-serif; font-weight: 400; fill: #94a3b8; }
      .mono  { font-family: 'JetBrains Mono', monospace; fill: #93c5fd; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; fill: #ffffff; }
      @keyframes dashCi { to { stroke-dashoffset: -28; } }
      .pipe { stroke-dasharray: 6 6; animation: dashCi 1.4s linear infinite; }
      @media (prefers-reduced-motion: reduce) { .pipe { animation: none; } }
    </style>
  </defs>

  <rect width="900" height="380" fill="url(#bgCi)" rx="14"/>
  <rect width="900" height="380" fill="url(#gridCi)" rx="14"/>

  <text x="40" y="34" class="title" font-size="16">CI/CD pipeline · Terraform with OIDC and gated apply</text>
  <text x="40" y="54" class="sub" font-size="11">No long-lived secrets · plan review on PRs · manual approval before apply on Prod</text>

  <!-- Stages -->
  <g transform="translate(40 100)" filter="url(#dropS)">
    <rect width="140" height="80" rx="12" fill="url(#stageGrad)" stroke="rgba(96,165,250,0.4)"/>
    <text x="70" y="22" text-anchor="middle" class="lbl" font-size="12">Developer</text>
    <text x="70" y="40" text-anchor="middle" class="mono" font-size="10">git push</text>
    <text x="70" y="56" text-anchor="middle" class="sub" font-size="10">feature/*</text>
    <text x="70" y="70" text-anchor="middle" class="sub" font-size="9" fill="#cbd5e1">opens PR → main</text>
  </g>
  <line x1="180" y1="140" x2="220" y2="140" stroke="rgba(96,165,250,0.65)" stroke-width="2" class="pipe" marker-end="url(#arrow)"/>

  <g transform="translate(220 100)" filter="url(#dropS)">
    <rect width="150" height="80" rx="12" fill="url(#stageGrad)" stroke="rgba(96,165,250,0.4)"/>
    <text x="75" y="22" text-anchor="middle" class="lbl" font-size="12">Validate</text>
    <text x="75" y="40" text-anchor="middle" class="mono" font-size="9">tflint · tfsec · fmt</text>
    <text x="75" y="56" text-anchor="middle" class="mono" font-size="9">checkov</text>
    <text x="75" y="70" text-anchor="middle" class="sub" font-size="9" fill="#cbd5e1">runs on PR</text>
  </g>
  <line x1="370" y1="140" x2="410" y2="140" stroke="rgba(96,165,250,0.65)" stroke-width="2" class="pipe" marker-end="url(#arrow)"/>

  <g transform="translate(410 100)" filter="url(#dropS)">
    <rect width="150" height="80" rx="12" fill="url(#stageGrad)" stroke="rgba(96,165,250,0.4)"/>
    <text x="75" y="22" text-anchor="middle" class="lbl" font-size="12">Plan</text>
    <text x="75" y="40" text-anchor="middle" class="mono" font-size="9">terraform plan -out</text>
    <text x="75" y="56" text-anchor="middle" class="mono" font-size="9">cost: infracost</text>
    <text x="75" y="70" text-anchor="middle" class="sub" font-size="9" fill="#cbd5e1">diff posted to PR</text>
  </g>
  <line x1="560" y1="140" x2="600" y2="140" stroke="rgba(96,165,250,0.65)" stroke-width="2" class="pipe" marker-end="url(#arrow)"/>

  <g transform="translate(600 100)" filter="url(#dropS)">
    <rect width="150" height="80" rx="12" fill="url(#approveGrad)" stroke="rgba(245,158,11,0.5)"/>
    <text x="75" y="22" text-anchor="middle" class="lbl" font-size="12" fill="#fde68a">Manual approval</text>
    <text x="75" y="42" text-anchor="middle" class="mono" font-size="10" fill="#fbbf24">Reviewer (Prod)</text>
    <text x="75" y="60" text-anchor="middle" class="sub" font-size="10" fill="#fde68a">required for main</text>
  </g>
  <line x1="750" y1="140" x2="790" y2="140" stroke="rgba(96,165,250,0.65)" stroke-width="2" class="pipe" marker-end="url(#arrow)"/>

  <g transform="translate(790 100)" filter="url(#dropS)">
    <rect width="80" height="80" rx="12" fill="url(#okGrad)" stroke="rgba(16,185,129,0.5)"/>
    <text x="40" y="28" text-anchor="middle" class="lbl" font-size="12" fill="#a7f3d0">Apply</text>
    <text x="40" y="46" text-anchor="middle" class="mono" font-size="9" fill="#6ee7b7">tf apply</text>
    <text x="40" y="62" text-anchor="middle" class="sub" font-size="9" fill="#a7f3d0">to Azure</text>
  </g>

  <!-- Sidebar: state + OIDC -->
  <g transform="translate(40 220)" filter="url(#dropS)">
    <rect width="380" height="120" rx="12" fill="rgba(15,23,42,0.7)" stroke="rgba(168,85,247,0.4)"/>
    <text x="20" y="26" class="lbl" font-size="12" fill="#e9d5ff">Remote State (Azure Blob)</text>
    <text x="20" y="46" class="mono" font-size="10">storage: stterraformstate001</text>
    <text x="20" y="62" class="mono" font-size="10">container: tfstate</text>
    <text x="20" y="78" class="mono" font-size="10">keys: per environment + workspace</text>
    <text x="20" y="98" class="sub" font-size="10" fill="#c4b5fd">+ Blob versioning + RBAC + Private Endpoint</text>
    <text x="20" y="112" class="sub" font-size="10" fill="#c4b5fd">+ Lease-based locking (built-in)</text>
  </g>

  <g transform="translate(440 220)" filter="url(#dropS)">
    <rect width="420" height="120" rx="12" fill="rgba(15,23,42,0.7)" stroke="rgba(34,211,238,0.4)"/>
    <text x="20" y="26" class="lbl" font-size="12" fill="#cffafe">Authentication · OIDC keyless</text>
    <text x="20" y="46" class="mono" font-size="10" fill="#67e8f9">User-Assigned Managed Identity</text>
    <text x="20" y="62" class="mono" font-size="10" fill="#67e8f9">→ federated to GitHub OIDC subject</text>
    <text x="20" y="78" class="mono" font-size="10" fill="#67e8f9">azure/login@v2 with no secrets</text>
    <text x="20" y="98" class="sub" font-size="10" fill="#cffafe">+ Least-privilege RBAC per environment</text>
    <text x="20" y="112" class="sub" font-size="10" fill="#cffafe">+ Conditional Access on the identity</text>
  </g>

  <!-- Bottom line -->
  <text x="450" y="365" text-anchor="middle" class="sub" font-size="10">Every step is observable in GitHub Actions + Azure Activity Log + Defender for Cloud</text>
</svg>
