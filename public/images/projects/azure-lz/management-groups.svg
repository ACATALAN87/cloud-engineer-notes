<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Azure management groups hierarchy aligned with CAF">
  <defs>
    <linearGradient id="bgMG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#050914"/>
    </linearGradient>
    <linearGradient id="rootGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="platformGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="landingGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="sandboxGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="subGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <pattern id="gridMG" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="rgba(96,165,250,0.08)" stroke-width="0.5"/>
    </pattern>
    <filter id="softShadowMG" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="off"/>
      <feFlood flood-color="#000" flood-opacity="0.45"/>
      <feComposite in2="off" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .lbl    { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; fill: #f1f5f9; }
      .sub    { font-family: 'Inter', system-ui, sans-serif; font-weight: 400; fill: #94a3b8; }
      .mono   { font-family: 'JetBrains Mono', monospace; fill: #94a3b8; }
      .title  { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; fill: #ffffff; }
      .policy { font-family: 'JetBrains Mono', monospace; fill: #c4b5fd; }

      @keyframes drop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
      .float { animation: drop 4s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .float { animation: none; } }
    </style>
  </defs>

  <rect width="900" height="520" fill="url(#bgMG)" rx="14"/>
  <rect width="900" height="520" fill="url(#gridMG)" rx="14"/>

  <!-- Title -->
  <text x="450" y="34" text-anchor="middle" class="title" font-size="16">Management Groups · CAF-aligned hierarchy</text>
  <text x="450" y="54" text-anchor="middle" class="sub" font-size="11">Each layer applies Azure Policy initiatives that cascade to children</text>

  <!-- Tenant Root -->
  <g transform="translate(380 80)" filter="url(#softShadowMG)" class="float">
    <rect width="140" height="46" rx="10" fill="url(#rootGrad)" stroke="rgba(196,181,253,0.5)"/>
    <text x="70" y="20" text-anchor="middle" class="lbl" font-size="12">Tenant Root</text>
    <text x="70" y="36" text-anchor="middle" class="policy" font-size="9">enforce: deny-public-ip</text>
  </g>

  <!-- Lines from root -->
  <line x1="450" y1="126" x2="200" y2="170" stroke="rgba(148,163,184,0.45)" stroke-width="1.5"/>
  <line x1="450" y1="126" x2="450" y2="170" stroke="rgba(148,163,184,0.45)" stroke-width="1.5"/>
  <line x1="450" y1="126" x2="700" y2="170" stroke="rgba(148,163,184,0.45)" stroke-width="1.5"/>

  <!-- Platform -->
  <g transform="translate(130 170)" filter="url(#softShadowMG)">
    <rect width="140" height="46" rx="10" fill="url(#platformGrad)" stroke="rgba(147,197,253,0.5)"/>
    <text x="70" y="20" text-anchor="middle" class="lbl" font-size="12">Platform</text>
    <text x="70" y="36" text-anchor="middle" class="policy" font-size="9">audit: shared-services</text>
  </g>
  <!-- Landing Zones -->
  <g transform="translate(380 170)" filter="url(#softShadowMG)">
    <rect width="140" height="46" rx="10" fill="url(#landingGrad)" stroke="rgba(103,232,249,0.5)"/>
    <text x="70" y="20" text-anchor="middle" class="lbl" font-size="12">Landing Zones</text>
    <text x="70" y="36" text-anchor="middle" class="policy" font-size="9">enforce: NSG flow logs</text>
  </g>
  <!-- Sandbox -->
  <g transform="translate(630 170)" filter="url(#softShadowMG)">
    <rect width="140" height="46" rx="10" fill="url(#sandboxGrad)" stroke="rgba(148,163,184,0.5)"/>
    <text x="70" y="20" text-anchor="middle" class="lbl" font-size="12">Sandbox</text>
    <text x="70" y="36" text-anchor="middle" class="policy" font-size="9">budget: $250 / mo</text>
  </g>

  <!-- Connector lines to children -->
  <line x1="200" y1="216" x2="100" y2="270" stroke="rgba(148,163,184,0.4)" stroke-width="1.2"/>
  <line x1="200" y1="216" x2="200" y2="270" stroke="rgba(148,163,184,0.4)" stroke-width="1.2"/>
  <line x1="200" y1="216" x2="300" y2="270" stroke="rgba(148,163,184,0.4)" stroke-width="1.2"/>

  <line x1="450" y1="216" x2="380" y2="270" stroke="rgba(148,163,184,0.4)" stroke-width="1.2"/>
  <line x1="450" y1="216" x2="520" y2="270" stroke="rgba(148,163,184,0.4)" stroke-width="1.2"/>

  <line x1="700" y1="216" x2="700" y2="270" stroke="rgba(148,163,184,0.4)" stroke-width="1.2"/>
  <line x1="700" y1="216" x2="800" y2="270" stroke="rgba(148,163,184,0.4)" stroke-width="1.2"/>

  <!-- Platform sub-MGs -->
  <g transform="translate(60 270)" filter="url(#softShadowMG)">
    <rect width="80" height="40" rx="8" fill="rgba(15,23,42,0.85)" stroke="rgba(96,165,250,0.35)"/>
    <text x="40" y="17" text-anchor="middle" class="sub" font-size="10" fill="#cbd5e1">Identity</text>
    <text x="40" y="30" text-anchor="middle" class="mono" font-size="8">MG</text>
  </g>
  <g transform="translate(160 270)" filter="url(#softShadowMG)">
    <rect width="80" height="40" rx="8" fill="rgba(15,23,42,0.85)" stroke="rgba(96,165,250,0.35)"/>
    <text x="40" y="17" text-anchor="middle" class="sub" font-size="10" fill="#cbd5e1">Mgmt</text>
    <text x="40" y="30" text-anchor="middle" class="mono" font-size="8">MG</text>
  </g>
  <g transform="translate(260 270)" filter="url(#softShadowMG)">
    <rect width="80" height="40" rx="8" fill="rgba(15,23,42,0.85)" stroke="rgba(96,165,250,0.35)"/>
    <text x="40" y="17" text-anchor="middle" class="sub" font-size="10" fill="#cbd5e1">Connectivity</text>
    <text x="40" y="30" text-anchor="middle" class="mono" font-size="8">MG</text>
  </g>

  <!-- Landing Zone sub-MGs -->
  <g transform="translate(340 270)" filter="url(#softShadowMG)">
    <rect width="80" height="40" rx="8" fill="rgba(15,23,42,0.85)" stroke="rgba(103,232,249,0.4)"/>
    <text x="40" y="17" text-anchor="middle" class="sub" font-size="10" fill="#cbd5e1">Corp</text>
    <text x="40" y="30" text-anchor="middle" class="mono" font-size="8">MG</text>
  </g>
  <g transform="translate(480 270)" filter="url(#softShadowMG)">
    <rect width="80" height="40" rx="8" fill="rgba(15,23,42,0.85)" stroke="rgba(103,232,249,0.4)"/>
    <text x="40" y="17" text-anchor="middle" class="sub" font-size="10" fill="#cbd5e1">Online</text>
    <text x="40" y="30" text-anchor="middle" class="mono" font-size="8">MG</text>
  </g>

  <!-- Sandbox subs -->
  <g transform="translate(660 270)" filter="url(#softShadowMG)">
    <rect width="80" height="40" rx="8" fill="rgba(15,23,42,0.85)" stroke="rgba(148,163,184,0.4)"/>
    <text x="40" y="17" text-anchor="middle" class="sub" font-size="10" fill="#cbd5e1">Dev users</text>
    <text x="40" y="30" text-anchor="middle" class="mono" font-size="8">MG</text>
  </g>
  <g transform="translate(760 270)" filter="url(#softShadowMG)">
    <rect width="80" height="40" rx="8" fill="rgba(15,23,42,0.85)" stroke="rgba(148,163,184,0.4)"/>
    <text x="40" y="17" text-anchor="middle" class="sub" font-size="10" fill="#cbd5e1">PoC</text>
    <text x="40" y="30" text-anchor="middle" class="mono" font-size="8">MG</text>
  </g>

  <!-- Subscriptions row -->
  <line x1="100" y1="310" x2="100" y2="360" stroke="rgba(148,163,184,0.3)" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="200" y1="310" x2="200" y2="360" stroke="rgba(148,163,184,0.3)" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="300" y1="310" x2="300" y2="360" stroke="rgba(148,163,184,0.3)" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="380" y1="310" x2="380" y2="360" stroke="rgba(148,163,184,0.3)" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="520" y1="310" x2="520" y2="360" stroke="rgba(148,163,184,0.3)" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="700" y1="310" x2="700" y2="360" stroke="rgba(148,163,184,0.3)" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="800" y1="310" x2="800" y2="360" stroke="rgba(148,163,184,0.3)" stroke-width="1" stroke-dasharray="3 3"/>

  <text x="450" y="350" text-anchor="middle" class="sub" font-size="10">— Subscriptions —</text>

  <!-- Sub examples -->
  <g transform="translate(50 365)">
    <rect width="100" height="34" rx="8" fill="url(#subGrad)" stroke="rgba(96,165,250,0.25)"/>
    <text x="50" y="15" text-anchor="middle" class="mono" font-size="9" fill="#cbd5e1">sub-identity-prod</text>
    <text x="50" y="28" text-anchor="middle" class="mono" font-size="8">$ EA</text>
  </g>
  <g transform="translate(160 365)">
    <rect width="80" height="34" rx="8" fill="url(#subGrad)" stroke="rgba(96,165,250,0.25)"/>
    <text x="40" y="15" text-anchor="middle" class="mono" font-size="9" fill="#cbd5e1">sub-mgmt</text>
    <text x="40" y="28" text-anchor="middle" class="mono" font-size="8">$ EA</text>
  </g>
  <g transform="translate(260 365)">
    <rect width="80" height="34" rx="8" fill="url(#subGrad)" stroke="rgba(96,165,250,0.25)"/>
    <text x="40" y="15" text-anchor="middle" class="mono" font-size="9" fill="#cbd5e1">sub-hub</text>
    <text x="40" y="28" text-anchor="middle" class="mono" font-size="8">$ EA</text>
  </g>
  <g transform="translate(330 365)">
    <rect width="100" height="34" rx="8" fill="url(#subGrad)" stroke="rgba(103,232,249,0.3)"/>
    <text x="50" y="15" text-anchor="middle" class="mono" font-size="9" fill="#cbd5e1">sub-lz-corp-prod</text>
    <text x="50" y="28" text-anchor="middle" class="mono" font-size="8">$ EA</text>
  </g>
  <g transform="translate(470 365)">
    <rect width="100" height="34" rx="8" fill="url(#subGrad)" stroke="rgba(103,232,249,0.3)"/>
    <text x="50" y="15" text-anchor="middle" class="mono" font-size="9" fill="#cbd5e1">sub-lz-online</text>
    <text x="50" y="28" text-anchor="middle" class="mono" font-size="8">$ EA</text>
  </g>
  <g transform="translate(650 365)">
    <rect width="100" height="34" rx="8" fill="url(#subGrad)" stroke="rgba(148,163,184,0.3)"/>
    <text x="50" y="15" text-anchor="middle" class="mono" font-size="9" fill="#cbd5e1">sub-sbx-001</text>
    <text x="50" y="28" text-anchor="middle" class="mono" font-size="8">$ MCA</text>
  </g>
  <g transform="translate(760 365)">
    <rect width="80" height="34" rx="8" fill="url(#subGrad)" stroke="rgba(148,163,184,0.3)"/>
    <text x="40" y="15" text-anchor="middle" class="mono" font-size="9" fill="#cbd5e1">sub-poc</text>
    <text x="40" y="28" text-anchor="middle" class="mono" font-size="8">$ MCA</text>
  </g>

  <!-- Bottom: Policy cascade visual -->
  <g transform="translate(40 425)">
    <rect width="820" height="74" rx="12" fill="rgba(15,23,42,0.6)" stroke="rgba(96,165,250,0.2)" stroke-dasharray="4 4"/>
    <text x="20" y="22" class="lbl" font-size="11" fill="#cbd5e1">Cascading policies (top-down inheritance)</text>
    <g transform="translate(20 36)">
      <rect width="180" height="28" rx="6" fill="rgba(168,85,247,0.18)" stroke="rgba(168,85,247,0.4)"/>
      <text x="90" y="18" text-anchor="middle" class="policy" font-size="10">DenyResourcesWithoutTags</text>
    </g>
    <g transform="translate(210 36)">
      <rect width="180" height="28" rx="6" fill="rgba(59,130,246,0.18)" stroke="rgba(59,130,246,0.4)"/>
      <text x="90" y="18" text-anchor="middle" class="policy" font-size="10">EnforceTLS1.2OnStorage</text>
    </g>
    <g transform="translate(400 36)">
      <rect width="180" height="28" rx="6" fill="rgba(6,182,212,0.18)" stroke="rgba(6,182,212,0.4)"/>
      <text x="90" y="18" text-anchor="middle" class="policy" font-size="10">RequirePrivateEndpoints</text>
    </g>
    <g transform="translate(590 36)">
      <rect width="210" height="28" rx="6" fill="rgba(245,158,11,0.18)" stroke="rgba(245,158,11,0.4)"/>
      <text x="105" y="18" text-anchor="middle" class="policy" font-size="10">DeployDiagnosticsToLogAnalytics</text>
    </g>
  </g>
</svg>
