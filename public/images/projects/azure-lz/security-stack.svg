<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-label="Azure Landing Zone security, governance and observability stack">
  <defs>
    <linearGradient id="bgSec" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#050914"/>
    </linearGradient>
    <linearGradient id="layerGov"  x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(168,85,247,0.22)"/>
      <stop offset="100%" stop-color="rgba(76,29,149,0.22)"/>
    </linearGradient>
    <linearGradient id="layerSec"  x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(59,130,246,0.22)"/>
      <stop offset="100%" stop-color="rgba(30,58,138,0.22)"/>
    </linearGradient>
    <linearGradient id="layerObs"  x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(34,211,238,0.22)"/>
      <stop offset="100%" stop-color="rgba(14,116,144,0.22)"/>
    </linearGradient>
    <linearGradient id="layerData" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(16,185,129,0.22)"/>
      <stop offset="100%" stop-color="rgba(6,78,59,0.22)"/>
    </linearGradient>
    <pattern id="gridSec" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="rgba(96,165,250,0.08)" stroke-width="0.5"/>
    </pattern>
    <filter id="dropSec" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="off"/>
      <feFlood flood-color="#000" flood-opacity="0.45"/>
      <feComposite in2="off" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; fill: #ffffff; }
      .lbl   { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; fill: #f1f5f9; }
      .sub   { font-family: 'Inter', system-ui, sans-serif; font-weight: 400; fill: #94a3b8; }
      .mono  { font-family: 'JetBrains Mono', monospace; fill: #cbd5e1; }
      .layer { font-family: 'JetBrains Mono', monospace; font-weight: 700; }

      @keyframes pulseSec { 0%,100% { opacity: 0.9; } 50% { opacity: 0.55; } }
      .pulse { animation: pulseSec 3.5s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
    </style>
  </defs>

  <rect width="900" height="500" fill="url(#bgSec)" rx="14"/>
  <rect width="900" height="500" fill="url(#gridSec)" rx="14"/>

  <text x="40" y="38" class="title" font-size="16">Security, governance and observability stack</text>
  <text x="40" y="58" class="sub" font-size="11">Layered defence-in-depth aligned with the Microsoft Cloud Security Benchmark</text>

  <!-- Layer 1: Governance -->
  <g transform="translate(40 90)">
    <rect width="820" height="80" rx="12" fill="url(#layerGov)" stroke="rgba(168,85,247,0.45)"/>
    <text x="20" y="22" class="layer" font-size="11" fill="#c4b5fd">L1 · GOVERNANCE</text>
    <g transform="translate(140 14)">
      <g transform="translate(0 0)" filter="url(#dropSec)">
        <rect width="150" height="52" rx="8" fill="rgba(15,23,42,0.85)" stroke="rgba(168,85,247,0.5)"/>
        <text x="75" y="20" text-anchor="middle" class="lbl" font-size="11">Azure Policy</text>
        <text x="75" y="36" text-anchor="middle" class="sub" font-size="10">Initiatives + assignments</text>
        <text x="75" y="48" text-anchor="middle" class="mono" font-size="9">deny / audit / deployIfNotExists</text>
      </g>
      <g transform="translate(165 0)" filter="url(#dropSec)">
        <rect width="150" height="52" rx="8" fill="rgba(15,23,42,0.85)" stroke="rgba(168,85,247,0.5)"/>
        <text x="75" y="20" text-anchor="middle" class="lbl" font-size="11">Management Groups</text>
        <text x="75" y="36" text-anchor="middle" class="sub" font-size="10">Hierarchy + RBAC</text>
        <text x="75" y="48" text-anchor="middle" class="mono" font-size="9">CAF-aligned structure</text>
      </g>
      <g transform="translate(330 0)" filter="url(#dropSec)">
        <rect width="150" height="52" rx="8" fill="rgba(15,23,42,0.85)" stroke="rgba(168,85,247,0.5)"/>
        <text x="75" y="20" text-anchor="middle" class="lbl" font-size="11">Tags &amp; Naming</text>
        <text x="75" y="36" text-anchor="middle" class="sub" font-size="10">Cost / Owner / Env</text>
        <text x="75" y="48" text-anchor="middle" class="mono" font-size="9">Enforced via Policy</text>
      </g>
      <g transform="translate(495 0)" filter="url(#dropSec)">
        <rect width="150" height="52" rx="8" fill="rgba(15,23,42,0.85)" stroke="rgba(168,85,247,0.5)"/>
        <text x="75" y="20" text-anchor="middle" class="lbl" font-size="11">Cost Management</text>
        <text x="75" y="36" text-anchor="middle" class="sub" font-size="10">Budgets + alerts</text>
        <text x="75" y="48" text-anchor="middle" class="mono" font-size="9">Per subscription + MG</text>
      </g>
    </g>
  </g>

  <!-- Layer 2: Identity & Security -->
  <g transform="translate(40 185)">
    <rect width="820" height="80" rx="12" fill="url(#layerSec)" stroke="rgba(96,165,250,0.45)"/>
    <text x="20" y="22" class="layer" font-size="11" fill="#93c5fd">L2 · IDENTITY &amp; SECURITY</text>
    <g transform="translate(140 14)">
      <g transform="translate(0 0)" filter="url(#dropSec)">
        <rect width="150" height="52" rx="8" fill="rgba(15,23,42,0.85)" stroke="rgba(96,165,250,0.5)"/>
        <text x="75" y="20" text-anchor="middle" class="lbl" font-size="11">Microsoft Entra ID</text>
        <text x="75" y="36" text-anchor="middle" class="sub" font-size="10">SSO + MFA + CAE</text>
        <text x="75" y="48" text-anchor="middle" class="mono" font-size="9">Conditional Access</text>
      </g>
      <g transform="translate(165 0)" filter="url(#dropSec)">
        <rect width="150" height="52" rx="8" fill="rgba(15,23,42,0.85)" stroke="rgba(96,165,250,0.5)"/>
        <text x="75" y="20" text-anchor="middle" class="lbl" font-size="11">PIM + RBAC</text>
        <text x="75" y="36" text-anchor="middle" class="sub" font-size="10">JIT elevated access</text>
        <text x="75" y="48" text-anchor="middle" class="mono" font-size="9">Least privilege</text>
      </g>
      <g transform="translate(330 0)" filter="url(#dropSec)">
        <rect width="150" height="52" rx="8" fill="rgba(15,23,42,0.85)" stroke="rgba(96,165,250,0.5)"/>
        <text x="75" y="20" text-anchor="middle" class="lbl" font-size="11">Key Vault</text>
        <text x="75" y="36" text-anchor="middle" class="sub" font-size="10">Secrets + keys + certs</text>
        <text x="75" y="48" text-anchor="middle" class="mono" font-size="9">RBAC + Priv Endpoint</text>
      </g>
      <g transform="translate(495 0)" filter="url(#dropSec)">
        <rect width="150" height="52" rx="8" fill="rgba(15,23,42,0.85)" stroke="rgba(96,165,250,0.5)"/>
        <text x="75" y="20" text-anchor="middle" class="lbl" font-size="11">Defender for Cloud</text>
        <text x="75" y="36" text-anchor="middle" class="sub" font-size="10">CSPM + CWPP</text>
        <text x="75" y="48" text-anchor="middle" class="mono" font-size="9">Secure Score</text>
      </g>
    </g>
  </g>

  <!-- Layer 3: Observability -->
  <g transform="translate(40 280)">
    <rect width="820" height="80" rx="12" fill="url(#layerObs)" stroke="rgba(34,211,238,0.45)"/>
    <text x="20" y="22" class="layer" font-size="11" fill="#67e8f9">L3 · OBSERVABILITY</text>
    <g transform="translate(140 14)">
      <g transform="translate(0 0)" filter="url(#dropSec)">
        <rect width="150" height="52" rx="8" fill="rgba(15,23,42,0.85)" stroke="rgba(34,211,238,0.5)"/>
        <text x="75" y="20" text-anchor="middle" class="lbl" font-size="11">Log Analytics</text>
        <text x="75" y="36" text-anchor="middle" class="sub" font-size="10">Central workspace</text>
        <text x="75" y="48" text-anchor="middle" class="mono" font-size="9">KQL queries</text>
      </g>
      <g transform="translate(165 0)" filter="url(#dropSec)">
        <rect width="150" height="52" rx="8" fill="rgba(15,23,42,0.85)" stroke="rgba(34,211,238,0.5)"/>
        <text x="75" y="20" text-anchor="middle" class="lbl" font-size="11">Azure Monitor</text>
        <text x="75" y="36" text-anchor="middle" class="sub" font-size="10">Metrics + Alerts</text>
        <text x="75" y="48" text-anchor="middle" class="mono" font-size="9">Action Groups</text>
      </g>
      <g transform="translate(330 0)" filter="url(#dropSec)">
        <rect width="150" height="52" rx="8" fill="rgba(15,23,42,0.85)" stroke="rgba(34,211,238,0.5)"/>
        <text x="75" y="20" text-anchor="middle" class="lbl" font-size="11">NSG Flow Logs</text>
        <text x="75" y="36" text-anchor="middle" class="sub" font-size="10">Traffic Analytics</text>
        <text x="75" y="48" text-anchor="middle" class="mono" font-size="9">Stored in Storage</text>
      </g>
      <g transform="translate(495 0)" filter="url(#dropSec)">
        <rect width="150" height="52" rx="8" fill="rgba(15,23,42,0.85)" stroke="rgba(34,211,238,0.5)"/>
        <text x="75" y="20" text-anchor="middle" class="lbl" font-size="11">Microsoft Sentinel</text>
        <text x="75" y="36" text-anchor="middle" class="sub" font-size="10">SIEM + SOAR</text>
        <text x="75" y="48" text-anchor="middle" class="mono" font-size="9">Optional add-on</text>
      </g>
    </g>
  </g>

  <!-- Layer 4: Data plane protection -->
  <g transform="translate(40 375)">
    <rect width="820" height="80" rx="12" fill="url(#layerData)" stroke="rgba(16,185,129,0.45)"/>
    <text x="20" y="22" class="layer" font-size="11" fill="#6ee7b7">L4 · DATA PLANE</text>
    <g transform="translate(140 14)">
      <g transform="translate(0 0)" filter="url(#dropSec)">
        <rect width="150" height="52" rx="8" fill="rgba(15,23,42,0.85)" stroke="rgba(16,185,129,0.5)"/>
        <text x="75" y="20" text-anchor="middle" class="lbl" font-size="11">Private Endpoints</text>
        <text x="75" y="36" text-anchor="middle" class="sub" font-size="10">PaaS into VNet</text>
        <text x="75" y="48" text-anchor="middle" class="mono" font-size="9">+ Private DNS</text>
      </g>
      <g transform="translate(165 0)" filter="url(#dropSec)">
        <rect width="150" height="52" rx="8" fill="rgba(15,23,42,0.85)" stroke="rgba(16,185,129,0.5)"/>
        <text x="75" y="20" text-anchor="middle" class="lbl" font-size="11">Encryption</text>
        <text x="75" y="36" text-anchor="middle" class="sub" font-size="10">TLS 1.2 + CMK</text>
        <text x="75" y="48" text-anchor="middle" class="mono" font-size="9">At rest + in transit</text>
      </g>
      <g transform="translate(330 0)" filter="url(#dropSec)">
        <rect width="150" height="52" rx="8" fill="rgba(15,23,42,0.85)" stroke="rgba(16,185,129,0.5)"/>
        <text x="75" y="20" text-anchor="middle" class="lbl" font-size="11">Azure Firewall</text>
        <text x="75" y="36" text-anchor="middle" class="sub" font-size="10">Egress filtering</text>
        <text x="75" y="48" text-anchor="middle" class="mono" font-size="9">Policy hierarchy</text>
      </g>
      <g transform="translate(495 0)" filter="url(#dropSec)">
        <rect width="150" height="52" rx="8" fill="rgba(15,23,42,0.85)" stroke="rgba(16,185,129,0.5)"/>
        <text x="75" y="20" text-anchor="middle" class="lbl" font-size="11">Backup &amp; DR</text>
        <text x="75" y="36" text-anchor="middle" class="sub" font-size="10">Recovery Services</text>
        <text x="75" y="48" text-anchor="middle" class="mono" font-size="9">Soft-delete + retention</text>
      </g>
    </g>
  </g>

  <!-- Side pulse indicator -->
  <circle cx="868" cy="125" r="5" fill="#a855f7" class="pulse"/>
  <circle cx="868" cy="220" r="5" fill="#3b82f6" class="pulse"/>
  <circle cx="868" cy="315" r="5" fill="#22d3ee" class="pulse"/>
  <circle cx="868" cy="410" r="5" fill="#10b981" class="pulse"/>

  <!-- Bottom -->
  <text x="450" y="488" text-anchor="middle" class="sub" font-size="10">All layers deployed declaratively via Terraform modules — drift detected on every plan</text>
</svg>
